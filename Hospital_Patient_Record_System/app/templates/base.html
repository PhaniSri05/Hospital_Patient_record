<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hospital Patient Record System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        /* ==============================
           GLOBAL
        ============================== */

        body {
            margin: 0;
            background: #f4f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #263238;
        }


        /* ==============================
           NAVBAR
        ============================== */

        .hospital-navbar {
    background: linear-gradient(
        135deg,
        #0d6efd,
        #0b5ed7
    );

    box-shadow: 0 4px 15px rgba(13, 110, 253, 0.20);
    padding: 14px 0;

    /* Keep navbar visible while scrolling */
    position: sticky;
    top: 0;
    z-index: 1030;
}

        .hospital-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: white !important;
            letter-spacing: 0.2px;
            text-decoration: none;
        }


        .hospital-brand i {
            font-size: 1.4rem;
            margin-right: 8px;
        }


        /* ==============================
           NAVIGATION BUTTONS
        ============================== */

        .nav-link-custom {
            color: rgba(255,255,255,0.90) !important;
            text-decoration: none;
            padding: 8px 12px;
            margin-left: 4px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-block;
        }


        .nav-link-custom:hover {
            background: rgba(255,255,255,0.16);
            color: white !important;
            transform: translateY(-1px);
        }


        .logout-link {
            background: rgba(220, 53, 69, 0.95);
            color: white !important;
        }


        .logout-link:hover {
            background: #dc3545;
        }


        /* ==============================
           MAIN CONTENT
        ============================== */

        .main-container {
            padding-top: 30px;
            padding-bottom: 40px;
            min-height: calc(100vh - 75px);
        }


        /* ==============================
           FLASH MESSAGES
        ============================== */

        .custom-alert {
            border: none;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            font-weight: 500;
        }


        /* ==============================
           CARDS
        ============================== */

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }


        .card-header {
            border-radius: 14px 14px 0 0 !important;
        }


        /* ==============================
           BUTTONS
        ============================== */

        .btn {
            border-radius: 8px;
            font-weight: 500;
        }


        /* ==============================
           TABLES
        ============================== */

        .table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }


        .table thead th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
        }


        .table tbody tr {
            transition: background 0.2s ease;
        }


        .table tbody tr:hover {
            background: #f8fafc;
        }


        /* ==============================
           FORM CONTROLS
        ============================== */

        .form-control,
        .form-select {
            border-radius: 8px;
            border: 1px solid #d9e2ec;
            padding: 10px 12px;
        }


        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.12);
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 992px) {

            .nav-link-custom {
                margin-top: 4px;
            }

        }


        @media (max-width: 768px) {

            .hospital-brand {
                font-size: 1.05rem;
            }

            .nav-link-custom {
                padding: 6px 8px;
                font-size: 0.85rem;
            }

        }

    </style>

</head>


<body>


<!-- ==============================
     NAVBAR
============================== -->

<nav class="navbar hospital-navbar">

    <div class="container-fluid px-4">

        <!-- Brand -->

        <a
            class="hospital-brand"
            href="/"
        >
            <i class="bi bi-hospital"></i>
            MediCare Hospital
        </a>


        <!-- Navigation -->

        <div class="d-flex flex-wrap align-items-center">

            <a
                class="nav-link-custom"
                href="/"
            >
                <i class="bi bi-grid-1x2-fill"></i>
                Dashboard
            </a>


            <a
                class="nav-link-custom"
                href="/patients"
            >
                <i class="bi bi-people-fill"></i>
                Patients
            </a>


            <a
                class="nav-link-custom"
                href="/doctors"
            >
                <i class="bi bi-person-badge-fill"></i>
                Doctors
            </a>


            <a
                class="nav-link-custom"
                href="/appointments"
            >
                <i class="bi bi-calendar-check-fill"></i>
                Appointments
            </a>


            <a
                class="nav-link-custom"
                href="/analytics"
            >
                <i class="bi bi-bar-chart-fill"></i>
                Analytics
            </a>


            <a
                class="nav-link-custom"
                href="/reports"
            >
                <i class="bi bi-file-earmark-bar-graph-fill"></i>
                Reports
            </a>


            <a
                class="nav-link-custom logout-link"
                href="/logout"
            >
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- ==============================
     MAIN CONTENT
============================== -->

<main class="container main-container">


    <!-- Flash Messages -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div
                    class="alert alert-info custom-alert"
                    role="alert"
                >
                    <i class="bi bi-info-circle-fill me-2"></i>
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- Page Content -->

    {% block content %}

    {% endblock %}


</main>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
